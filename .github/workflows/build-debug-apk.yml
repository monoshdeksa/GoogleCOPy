name: Build & Publish Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate debug.keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Run unit tests and build Debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk SalinOrder-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalinOrder-debug-apk
          path: SalinOrder-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-latest"
          NOTES="Build APK debug otomatis dari commit \`${GITHUB_SHA::7}\` pada branch \`${GITHUB_REF_NAME}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SalinOrder-debug.apk --clobber
            gh release edit "$TAG" --title "SalinOrder Debug APK (Latest)" --notes "$NOTES"
          else
            gh release create "$TAG" SalinOrder-debug.apk \
              --title "SalinOrder Debug APK (Latest)" \
              --notes "$NOTES" \
              --prerelease
          fi
